repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: mixed-line-ending
    args: [--fix=lf]
  - id: check-merge-conflict
  - id: check-added-large-files
  - id: check-case-conflict
  - id: check-symlinks
  - id: check-json
  - id: check-toml
  - id: check-yaml
  - id: check-xml
  - id: fix-byte-order-marker
  - id: check-executables-have-shebangs
  - id: detect-private-key

- repo: https://github.com/jonaprieto/precommit-lean
  rev: v0.1.6
  hooks:
  - id: lean-style
  - id: lean-axioms
    args:
    - --target=TermColor.Terminal.Properties
    - --namespace=TermColor.Terminal
    - --native=parse_size_rows_columns
    - --native=parse_size_accepts_mixed_whitespace
    - --native=parse_size_rejects_missing_dimension
    - --native=parse_size_rejects_zero
    - --native=live_region_starts_without_cursor_motion
    - --native=live_region_clears_removed_lines
    - --native=live_region_clears_to_empty
    - --native=live_region_finishes_with_newline
    - --native=live_progress_uses_widgets
    - --native=live_indeterminate_progress_uses_widgets
    - --native=live_spinner_uses_widgets
    - --native=live_shimmer_uses_widgets
    - --native=live_status_uses_widgets
    - --native=live_table_uses_widgets
    - --native=clear_line_ends_with_carriage_return
    - --native=live_region_redraws_single_line
    - --native=parse_sgr_mouse_event
    - --native=parse_mouse_filters_press_release_and_scroll
    - --native=parse_sgr_mouse_drag_modifiers
    - --native=screen_diff_rewrites_changed_lines
    - --native=screen_diff_rewrites_selection_style_flip
    - --native=screen_diff_clears_removed_trailing_rows
    - --native=hit_test_accepts_only_left_presses
    - --native=hit_test_uses_first_overlapping_region
    - --native=input_fixture_retries_timeout
    - --native=input_fixture_eof_stops
    - --native=input_fixture_standalone_escape
    - --native=input_fixture_reads_csi_sequence
    - --native=input_fixture_preserves_invalid_byte_handling
    - --native=input_fixture_cancellation_does_not_read
    - --native=buffer_round_trips_fixed_surface
    - --native=buffer_initial_draw_is_positioned
    - --native=buffer_unchanged_frame_is_empty
    - --native=buffer_diff_starts_at_changed_cell
    - --native=buffer_marks_wide_glyph_continuation
    - --native=buffer_preserves_style_and_link_metadata
    - --native=buffer_combining_marks_do_not_consume_cells
    - --native=buffer_overwrite_clears_wide_continuation
    - --native=ui_column_preserves_order
    - --native=ui_row_composes_columns
    - --native=ui_constraints_resolve_fixed_percent_fill
    - --native=ui_prefix_names_child_targets
    - --native=focus_ring_traverses_composed_children
    - --native=target_routes_focus_and_mouse_events
    - --native=component_maps_parent_messages
  - id: lean-modules
