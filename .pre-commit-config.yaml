repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: mixed-line-ending
    args: [--fix=lf]
  - id: check-merge-conflict
  - id: check-added-large-files
  - id: check-case-conflict
  - id: check-symlinks
  - id: check-json
  - id: check-toml
  - id: check-yaml
  - id: check-xml
  - id: fix-byte-order-marker
  - id: check-executables-have-shebangs
  - id: detect-private-key

- repo: https://github.com/jonaprieto/precommit-lean
  rev: v0.1.3
  hooks:
  - id: lean-style
  - id: lean-axioms
    args:
    - --target=TermColor.Terminal.Properties
    - --namespace=TermColor.Terminal
    - --native=parse_size_rows_columns
    - --native=parse_size_accepts_mixed_whitespace
    - --native=parse_size_rejects_missing_dimension
    - --native=parse_size_rejects_zero
    - --native=live_region_starts_without_cursor_motion
    - --native=live_region_clears_removed_lines
    - --native=live_region_clears_to_empty
    - --native=live_region_finishes_with_newline
    - --native=live_progress_uses_widgets
    - --native=live_indeterminate_progress_uses_widgets
    - --native=live_spinner_uses_widgets
    - --native=live_shimmer_uses_widgets
    - --native=live_status_uses_widgets
    - --native=live_table_uses_widgets
    - --native=clear_line_ends_with_carriage_return
    - --native=live_region_redraws_single_line
    - --native=parse_sgr_mouse_event
    - --native=parse_mouse_filters_press_release_and_scroll
    - --native=parse_sgr_mouse_drag_modifiers
    - --native=screen_diff_rewrites_changed_lines
    - --native=hit_test_accepts_only_left_presses
    - --native=hit_test_uses_first_overlapping_region
  - id: lean-modules
