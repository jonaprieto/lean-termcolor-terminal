name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: jonaprieto/precommit-lean/.github/actions/precommit@v0.1.1
        with:
          token: ${{ secrets.ECOSYSTEM_READ_TOKEN || github.token }}
          skip: lean-axioms
      - name: Validate README artwork
        run: python3 -c 'import pathlib, xml.etree.ElementTree as ET; [ET.parse(path) for path in pathlib.Path("assets").glob("*.svg")]'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Authenticate Lake dependencies
        env:
          TERMCOLOR_READ_TOKEN: ${{ secrets.TERMCOLOR_READ_TOKEN }}
        run: |
          test -n "$TERMCOLOR_READ_TOKEN"
          git config --global url."https://x-access-token:${TERMCOLOR_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Cache elan toolchain
        uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache build
        uses: actions/cache@v6
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lakefile.lean', 'lean-toolchain') }}
          restore-keys: lake-${{ runner.os }}-
      - uses: leanprover/lean-action@v1
        with:
          build-args: "TermColor.Terminal TermColor.Terminal.Properties demo"
      - uses: jonaprieto/precommit-lean/.github/actions/precommit@v0.1.1
        with:
          token: ${{ secrets.ECOSYSTEM_READ_TOKEN || github.token }}
          hooks: lean-axioms
